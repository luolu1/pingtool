name: Release

# Build the Windows binaries and publish them to a GitHub Release.
# Push a tag like v1.0.0 to create/update the release; use the manual
# "Run workflow" button to only build and keep the artifacts.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    name: Build Windows binaries
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          # Go 1.20 is the last release that supports Windows 7 / 8 /
          # Server 2008 R2 / 2012 / 2012 R2. Newer toolchains refuse to launch
          # on those systems ("若要找到适用于你的电脑的版本，请咨询软件发布者").
          go-version: "1.20.14"
          cache: true

      - name: Run tests
        run: go test ./...

      - name: Install rsrc
        run: go install github.com/akavel/rsrc@latest

      - name: Generate icon
        run: go run ./tools/genicon -o app.ico

      - name: Build Windows binaries
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$PATH:$(go env GOPATH)/bin"
          mkdir -p dist

          build() {
            local arch="$1" out="$2"
            echo "::group::build windows/$arch"
            rsrc -manifest pingtool.manifest -ico app.ico \
              -arch "$arch" -o "rsrc_windows_${arch}.syso"
            GOOS=windows GOARCH="$arch" go build -trimpath \
              -ldflags "-H windowsgui -s -w" -o "dist/${out}" .
            echo "::endgroup::"
          }

          build amd64 PingTool-windows-x64.exe
          build arm64 PingTool-windows-arm64.exe
          build 386   PingTool-windows-x86.exe

          ls -la dist

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pingtool-windows
          path: dist/*
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true
